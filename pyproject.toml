[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fretmap"
version = "0.1.0"
description = "DSP-based guitar transcription: detects notes, intervals and chords from an isolated guitar track and maps them to tab and fretboard diagrams."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12",
]

[project.scripts]
fretmap = "fretmap.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["fretmap*"]

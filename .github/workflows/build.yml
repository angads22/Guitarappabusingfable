name: Build executables

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to release (e.g. v0.2.0); empty = build only"
        required: false
        default: ""
  push:
    branches: ["**"]
    tags: ["v*"]

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: fretmap-windows
            binary: dist/fretmap.exe
            gui_binary: dist/fretmap-gui.exe
          - os: macos-latest
            artifact: fretmap-macos
            binary: dist/fretmap
            gui_binary: dist/fretmap-gui
          - os: ubuntu-latest
            artifact: fretmap-linux
            binary: dist/fretmap
            gui_binary: dist/fretmap-gui
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install . pyinstaller pytest

      - name: Test
        run: python -m pytest tests -q

      - name: Build single-file executables (CLI + GUI)
        run: |
          pyinstaller --onefile --name fretmap --collect-all soundfile --console fretmap/__main__.py
          pyinstaller --onefile --name fretmap-gui --collect-all soundfile --windowed packaging/gui_launcher.py

      - name: Smoke test CLI binary
        shell: bash
        run: |
          "${{ matrix.binary }}" --help
          python examples/make_demo.py demo
          "${{ matrix.binary }}" demo/rhythm.wav --events

      - name: Smoke test GUI binary launches (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb
          xvfb-run -a ./dist/fretmap-gui &
          GUI_PID=$!
          sleep 10
          kill -0 $GUI_PID   # still alive after 10s = window opened fine
          kill $GUI_PID

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.binary }}
            ${{ matrix.gui_binary }}

  release:
    name: Attach binaries to release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename binaries per platform
        # Names must match fretmap.updater.asset_name(), which the
        # self-updater in shipped executables uses to find its download.
        run: |
          mkdir release
          cp artifacts/fretmap-windows/fretmap.exe release/fretmap-windows.exe
          cp artifacts/fretmap-windows/fretmap-gui.exe release/fretmap-gui-windows.exe
          cp artifacts/fretmap-macos/fretmap release/fretmap-macos
          cp artifacts/fretmap-macos/fretmap-gui release/fretmap-gui-macos
          cp artifacts/fretmap-linux/fretmap release/fretmap-linux
          cp artifacts/fretmap-linux/fretmap-gui release/fretmap-gui-linux

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
